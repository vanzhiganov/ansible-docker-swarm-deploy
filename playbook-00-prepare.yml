---
- name: swarm prepare
  hosts:
  - swarm_nodes
  tasks:
  - name: install deps
    package:
      name: epel-release
      state: present

  # TIME
  - name: install deps
    package:
      name: [
        chrony,
      ]
      state: present
  - systemd:
      name: chronyd
      state: restarted
      enabled: true
  - ansible.builtin.shell: chronyc -a tracking
  - ansible.builtin.shell: chronyc -a 'burst 4/4'
  - ansible.builtin.shell: chronyc -a makestep

  # DOCKER
  - name: install deps
    package:
      name: [
        yum-utils,
        python3-pip,
        python3-requests,
        python3-jsondiff,
        python3-pyyaml,
      ]
      state: present

  # community.docker modules need the Docker SDK for Python (docker>=5.0.0)
  # installed into the *same* interpreter Ansible uses on the target
  # (ansible_python_interpreter), otherwise the import fails with
  # "No module named 'docker'".
  - name: install docker python module
    ansible.builtin.command:
      cmd: >-
        {{ ansible_python_interpreter | default('python3') }} -m pip install
        "docker>=5.0.0"
    register: docker_sdk_install
    changed_when: "'Successfully installed' in docker_sdk_install.stdout"

  - name: Add Docker repository
    shell: yum-config-manager --add-repo=https://download.docker.com/linux/centos/docker-ce.repo
    args:
      creates: /etc/yum.repos.d/docker-ce.repo

  - package:
      name: [
        docker-ce,
        docker-ce-cli,
        containerd.io,
        docker-buildx-plugin,
        docker-compose-plugin
      ]
      state: present

  - systemd:
      name: docker
      state: started
      enabled: true



  - systemd:
      name: firewalld
      state: started
      enabled: true

  - name: docker swarm port
    ansible.posix.firewalld:
      port: 2377/tcp
      permanent: true
      state: disabled

  - name: docker swarm port
    ansible.posix.firewalld:
      port: 7946/tcp
      permanent: true
      state: disabled

  - name: docker swarm port
    ansible.posix.firewalld:
      port: 7946/udp
      permanent: true
      state: disabled

  - name: docker swarm port
    ansible.posix.firewalld:
      port: 4789/udp
      permanent: true
      state: disabled

  tags:
  - prepare
